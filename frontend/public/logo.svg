<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121214" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    
    <!-- Yellow Neon Glow -->
    <filter id="yellowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#FACC15" stroke-width="6" stroke-opacity="0.5" />

  <!-- Outer Neon Yellow Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#FACC15" stroke-width="8" filter="url(#yellowGlow)" stroke-opacity="0.9" />

  <!-- Bus Symbol (Styled in Cyber Yellow & Carbon Black) -->
  <g transform="translate(128, 128) scale(0.5)" filter="url(#yellowGlow)">
    <!-- Bus Roof & Body -->
    <rect x="64" y="64" width="384" height="288" rx="40" fill="#FACC15" />
    
    <!-- Bus Windshield -->
    <rect x="96" y="96" width="320" height="112" rx="10" fill="#09090b" stroke="#FACC15" stroke-width="4" />
    
    <!-- Left Light -->
    <circle cx="128" cy="300" r="24" fill="#FFFFFF" stroke="#09090b" stroke-width="4" />
    <!-- Right Light -->
    <circle cx="384" cy="300" r="24" fill="#FFFFFF" stroke="#09090b" stroke-width="4" />
    
    <!-- Grille -->
    <rect x="192" y="280" width="128" height="40" rx="8" fill="#09090b" />
    
    <!-- Wheels -->
    <rect x="96" y="352" width="64" height="48" rx="10" fill="#000000" stroke="#FACC15" stroke-width="3" />
    <rect x="352" y="352" width="64" height="48" rx="10" fill="#000000" stroke="#FACC15" stroke-width="3" />
  </g>
</svg>
