<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030807" />
      <stop offset="100%" stop-color="#061210" />
    </linearGradient>
    
    <!-- Neon Ruby/Rose Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#10b981" stroke-width="6" stroke-opacity="0.3" />

  <!-- Outer Neon Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ef4444" stroke-width="8" filter="url(#neonGlow)" stroke-opacity="0.8" />

  <!-- Bus Symbol (Styled as a native app logo) -->
  <g transform="translate(128, 128) scale(0.5)" filter="url(#neonGlow)">
    <!-- Bus Roof & Body -->
    <rect x="64" y="64" width="384" height="288" rx="40" fill="#f87171" />
    
    <!-- Bus Windshield -->
    <rect x="96" y="96" width="320" height="112" rx="10" fill="#030807" stroke="#34d399" stroke-width="4" />
    
    <!-- Left Light -->
    <circle cx="128" cy="300" r="24" fill="#fbbf24" />
    <!-- Right Light -->
    <circle cx="384" cy="300" r="24" fill="#fbbf24" />
    
    <!-- Grille -->
    <rect x="192" y="280" width="128" height="40" rx="8" fill="#1e293b" />
    
    <!-- Wheels -->
    <rect x="96" y="352" width="64" height="48" rx="10" fill="#0f172a" />
    <rect x="352" y="352" width="64" height="48" rx="10" fill="#0f172a" />
  </g>
</svg>
